<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="440" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
    <marker id="arwp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#111827">Os três juntos em um sistema</text>
  <text x="420" y="78" font-size="12.5" fill="#6b7280" text-anchor="middle">O agente decide, a cada passo, se busca conhecimento (RAG) ou aciona uma ferramenta (MCP).</text>

  <!-- Usuario -->
  <rect x="28" y="180" width="120" height="60" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="88" y="216" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Usuário</text>

  <!-- Agente -->
  <rect x="330" y="150" width="180" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="420" y="182" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">Agente (LLM)</text>
  <text x="420" y="206" font-size="12" fill="#4c1d95" text-anchor="middle">planeja / age / observa</text>
  <path d="M372 250 A30 16 0 1 1 468 250" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arwp)"/>
  <text x="420" y="270" font-size="11" fill="#6d28d9" text-anchor="middle">loop</text>

  <!-- Resposta -->
  <rect x="692" y="180" width="120" height="60" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="752" y="216" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Resposta</text>

  <!-- RAG branch -->
  <rect x="248" y="332" width="154" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="325" y="354" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">RAG</text>
  <text x="325" y="372" font-size="10.5" fill="#134e4a" text-anchor="middle">busca conhecimento</text>
  <rect x="248" y="398" width="154" height="30" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="325" y="418" font-size="10.5" fill="#134e4a" text-anchor="middle">base: PDFs, docs</text>

  <!-- MCP branch -->
  <rect x="438" y="332" width="154" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="354" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">MCP</text>
  <text x="515" y="372" font-size="10.5" fill="#1e3a8a" text-anchor="middle">aciona ferramenta</text>
  <rect x="438" y="398" width="154" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="515" y="418" font-size="10.5" fill="#1e3a8a" text-anchor="middle">APIs, banco, arquivos</text>

  <!-- arrows -->
  <line x1="150" y1="210" x2="322" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="512" y1="210" x2="686" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="388" y1="282" x2="340" y2="328" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="452" y1="282" x2="500" y2="328" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="325" y1="384" x2="325" y2="396" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="515" y1="384" x2="515" y2="396" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw)"/>
</svg>
